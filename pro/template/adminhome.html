<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
  <title>LabMart</title>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="format-detection" content="telephone=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="author" content="">
  <meta name="keywords" content="">
  <meta name="description" content="">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.css" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet"
  integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">

<link rel="stylesheet" type="text/css" href="{% static 'css/vendor.css' %}">
<link rel="stylesheet" type="text/css" href="{% static 'style.css' %}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chilanka&family=Montserrat:wght@300;400;500&display=swap"
  rel="stylesheet">

</head>
<body>
<header>
  <div class="container py-2">
    <div class="row py-4 align-items-center">

      <div class="col-sm-4 col-lg-3 text-center text-sm-start">
        <div class="main-logo">
            <img src="{% static 'images/logo.png' %}" alt="logo" class="img-fluid">
        </div>
      </div>
    </div>
  </div>

  <div class="container-fluid">
    <hr class="m-0">
  </div>

  <div class="container">
    <nav class="navbar navbar-expand-lg main-menu">

      <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar" aria-controls="offcanvasNavbar">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasNavbar" aria-labelledby="offcanvasNavbarLabel">
        <div class="offcanvas-header justify-content-center">
          <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body justify-content-between">
          <ul class="navbar-nav menu-list list-unstyled d-flex gap-md-3 mb-0">
            <li class="nav-item"><a href="adminhome" class="nav-link active">Home</a></li>
            <li class="nav-item"><a href="addproduct" class="nav-link">Add Products</a></li>
            <li class="nav-item"><a href="viewproduct" class="nav-link">View Products</a></li>
            <li class="nav-item"><a href="viewuser" class="nav-link">View Users</a></li>
            <li class="nav-item"><a href="viewfeedback" class="nav-link">View Feedback</a></li>
            <li class="nav-item"><a href="orderdetails" class="nav-link">Order Details</a></li>
            <li class="nav-item"><a href="logout" class="nav-link">Logout</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </div>
</header>

<section id="banner" style="background:#F9F3EC;">
  <div id="bannerCarousel" class="carousel slide" data-bs-ride="carousel">

    <!-- Indicators (optional) -->
    <div class="carousel-indicators">
      <button type="button" data-bs-target="#bannerCarousel" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
      <button type="button" data-bs-target="#bannerCarousel" data-bs-slide-to="1" aria-label="Slide 2"></button>
      <button type="button" data-bs-target="#bannerCarousel" data-bs-slide-to="2" aria-label="Slide 3"></button>
    </div>

    <!-- Slides -->
    <div class="carousel-inner">

      <!-- Slide 1 -->
      <div class="carousel-item active">
        <div class="d-flex justify-content-center align-items-center" style="min-height:70vh;">
          <a href="adminhome">
            <img src="{% static 'images/logo4.png' %}" alt="Banner 1" class="img-fluid">
          </a>
        </div>
      </div>

      <!-- Slide 2 -->
      <div class="carousel-item">
        <div class="d-flex justify-content-center align-items-center" style="min-height:70vh;">
          <a href="adminhome">
            <img src="{% static 'images/logo4.png' %}" alt="Banner 2" class="img-fluid">
          </a>
        </div>
      </div>

      <!-- Slide 3 -->
      <div class="carousel-item">
        <div class="d-flex justify-content-center align-items-center" style="min-height:70vh;">
          <a href="adminhome">
            <img src="{% static 'images/logo4.png' %}" alt="Banner 3" class="img-fluid">
          </a>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <button class="carousel-control-prev" type="button" data-bs-target="#bannerCarousel" data-bs-slide="prev">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#bannerCarousel" data-bs-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Next</span>
    </button>
  </div>
</section>

  <div id="footer-bottom">
    <div class="container">
      <hr class="m-0">
      <div class="row mt-3">
        <div class="col-md-6 copyright">
          <p class="secondary-font">© 2025 LabMart. All rights reserved.</p>
        </div>
      </div>
    </div>
  </div>

  <script src="js/jquery-1.11.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe"
    crossorigin="anonymous"></script>
  <script src="js/plugins.js"></script>
  <script src="js/script.js"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
</body>
</html>
