<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LabMart</title>
</head>
<body><!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
  <title>LabMart</title>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="format-detection" content="telephone=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="author" content="">
  <meta name="keywords" content="">
  <meta name="description" content="">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.css" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet"
  integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">

<link rel="stylesheet" type="text/css" href="{% static 'css/vendor.css' %}">
<link rel="stylesheet" type="text/css" href="{% static 'style.css' %}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chilanka&family=Montserrat:wght@300;400;500&display=swap"
  rel="stylesheet">

</head>
<body>
<header>
  <div class="container py-2">
    <div class="row py-4 align-items-center">

      <div class="col-sm-4 col-lg-3 text-center text-sm-start">
        <div class="main-logo">
            <img src="{% static 'images/logo.png' %}" alt="logo" class="img-fluid">
        </div>
      </div>

      <div class="col-sm-8 col-lg-9 d-flex justify-content-end gap-5 align-items-center mt-4 mt-sm-0">
        <div class="support-box text-end d-none d-xl-block">
          <span class="fs-6 secondary-font text-muted">Phone</span>
          <h5 class="mb-0">+980-34984089</h5>
        </div>
        <div class="support-box text-end d-none d-xl-block">
          <span class="fs-6 secondary-font text-muted">Email</span>
          <h5 class="mb-0">labmart@gmail.com</h5>
        </div>
      </div>
    </div>
  </div>

  <div class="container-fluid">
    <hr class="m-0">
  </div>

  <div class="container">
    <nav class="navbar navbar-expand-lg main-menu">

      <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasNavbar" aria-labelledby="offcanvasNavbarLabel">
        <div class="offcanvas-header justify-content-center">
          <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body justify-content-between">
          <ul class="navbar-nav menu-list list-unstyled d-flex gap-md-3 mb-0">
            <li class="nav-item"><a href="index" class="nav-link active">Home</a></li>
            <li class="nav-item"><a href="about" class="nav-link">About</a></li>
            <li class="nav-item"><a href="register" class="nav-link">Register</a></li>
            <li class="nav-item"><a href="login" class="nav-link">Login</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </div>
</header>

<section id="about" class="py-5" style="background: #F9F3EC; min-height:100vh; display:flex; align-items:center;">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="bg-white p-4 rounded shadow-sm">
          <h2 class="h2 fw-bold mb-4 text-center">Register</h2>
          <form action="" method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <!-- Name -->
            <div class="mb-3">
              <label for="name" class="form-label">Name</label>
              <input type="text" id="name" name="name" class="form-control" placeholder="Enter your name" required>
            </div>

            <!-- Image -->
            <div class="mb-3">
              <label for="userImage" class="form-label">Your Image</label>
              <input type="file" id="userImage" name="Image" class="form-control">
            </div>

            <!-- Email -->
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" id="email" name="email" class="form-control" placeholder="Enter your email" required>
            </div>

            <!-- Phone Number -->
            <div class="mb-3">
              <label for="pho_no" class="form-label">Phone Number</label>
              <input type="tel" id="pho_no" name="pho_no" class="form-control" placeholder="Enter your phone number" required>
            </div>

            <!-- Username -->
            <div class="mb-3">
              <label for="username" class="form-label">Username</label>
              <input type="text" id="username" name="username" class="form-control" placeholder="Choose a username" required>
            </div>

              {% if messages %}
              <div class="card-footer">
                  {% for message in messages %}
                  <div class="alert alert-info mt-2">{{ message }}</div>
                  {% endfor %}
              </div>
              {% endif %}

            <!-- Password -->
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
            </div>

            <!-- Submit -->
            <div class="text-center">
              <button type="submit" class="btn btn-primary w-100">Register</button>
            </div>
          </form>
            <div class="text-center mt-4">
                <h6 class="fw-normal text-muted">Already have an account? <a href="login" class="text-primary text-decoration-none fw-semibold">Login</a></h6>
            </div>
      </div>
    </div>
    </div>
  </div>
</section>

  <div id="footer-bottom">
    <div class="container">
      <hr class="m-0">
      <div class="row mt-3">
        <div class="col-md-6 copyright">
          <p class="secondary-font">© 2025 LabMart. All rights reserved.</p>
        </div>
      </div>
    </div>
  </div>

  <script src="js/jquery-1.11.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe"
    crossorigin="anonymous"></script>
  <script src="js/plugins.js"></script>
  <script src="js/script.js"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
</body>
</html>
